name: Refrescar vivos de YouTube

# Corre cada 15 min y actualiza config/channels.json con el vivo actual de
# cada canal de YouTube. Tambien se puede disparar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-youtube
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolver IDs de vivo
        run: python3 tools/refresh_youtube_lives.py
      - name: Commit si hubo cambios
        run: |
          if ! git diff --quiet -- config/channels.json; then
            git config user.name  "selah-bot"
            git config user.email "bot@users.noreply.github.com"
            git add config/channels.json
            git commit -m "auto: refrescar IDs de vivo de YouTube"
            git push
          else
            echo "Sin cambios."
          fi
